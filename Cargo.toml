[workspace]
resolver = "2"
members = [
    "crates/rustykrab-core",
    "crates/rustykrab-store",
    "crates/rustykrab-runtime",
    "crates/rustykrab-gateway",
    "crates/rustykrab-agent",
    "crates/rustykrab-providers",
    "crates/rustykrab-tools",
    "crates/rustykrab-channels",
    "crates/rustykrab-skills",
    "crates/rustykrab-cli",
    "crates/rustykrab-memory",
    "crates/rustykrab-dream",
    "crates/rustykrab-e2e",
]

[workspace.package]
version = "5.2.27"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gcbh/rustycrab"

[workspace.dependencies]
# Async runtime & networking
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
axum = "0.8"
# `http2` is required for APNs, which refuses HTTP/1.1. It was absent, so
# `h2` was not in the tree at all and a push would have failed at connect.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "http2"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Embedding static assets
rust-embed = "8"

# Async trait support
async-trait = "0.1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "3"
# Reads the host's IANA zone so a fresh install schedules in the operator's
# local time without needing RUSTYKRAB_TIMEZONE set.
iana-time-zone = "0.1"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# ES256 for APNs provider tokens. Already in the tree via rustls, so
# this adds no new code — only a direct dependency edge.
ring = "0.17"
aes-gcm = "0.10"
argon2 = "0.5"
security-framework = { version = "3", features = ["OSX_10_15"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = "0.10"

# Browser automation (Chrome DevTools Protocol)
chromiumoxide = "0.9"

# Email (IMAP + SMTP)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs", "builder"] }
mail-parser = "0.9"

# Futures combinators
futures = "0.3"

# Regular expressions
regex = "1"

# System-level interfaces (resource limits, process isolation)
libc = "0.2"

# TLS (unified on rustls — no OpenSSL dependency)
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"

# Internal crates
rustykrab-core = { path = "crates/rustykrab-core" }
rustykrab-store = { path = "crates/rustykrab-store" }
rustykrab-runtime = { path = "crates/rustykrab-runtime" }
rustykrab-gateway = { path = "crates/rustykrab-gateway" }
rustykrab-agent = { path = "crates/rustykrab-agent" }
rustykrab-providers = { path = "crates/rustykrab-providers" }
rustykrab-tools = { path = "crates/rustykrab-tools" }
rustykrab-channels = { path = "crates/rustykrab-channels" }
rustykrab-skills = { path = "crates/rustykrab-skills" }
rustykrab-cli = { path = "crates/rustykrab-cli" }
rustykrab-memory = { path = "crates/rustykrab-memory" }
rustykrab-dream = { path = "crates/rustykrab-dream" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
